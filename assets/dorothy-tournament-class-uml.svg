<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Detailed tournament UML class diagram</title>
  <desc id="description">A conventional UML class diagram showing tournament entities with fields and operations, composition and multiplicities, and the interfaces realized by the tournament interactor, match runner, presenter, and in-memory data access implementation.</desc>
  <defs>
    <style>
      .box { fill: #fffaf0; stroke: #51483e; stroke-width: 2.5; }
      .entity { fill: #fff3cf; }
      .usecase { fill: #e9f4e5; }
      .adapter { fill: #e6eefb; }
      .data { fill: #e4f5f7; }
      .iface { fill: #f1e8f7; }
      .rule { stroke: #51483e; stroke-width: 1.5; }
      .name { font: 700 18px Arial, sans-serif; fill: #27241f; text-anchor: middle; }
      .name-small { font: 700 15px Arial, sans-serif; fill: #27241f; text-anchor: middle; }
      .stereo { font: italic 700 12px Arial, sans-serif; fill: #665e54; text-anchor: middle; }
      .member { font: 13px Consolas, monospace; fill: #302c27; }
      .member-small { font: 11.5px Consolas, monospace; fill: #302c27; }
      .section { font: 700 13px Arial, sans-serif; fill: #665e54; letter-spacing: 2px; }
      .label { font: 12px Arial, sans-serif; fill: #51483e; }
      .note { font: 12px Arial, sans-serif; fill: #665e54; }
      .composition { fill: none; stroke: #51483e; stroke-width: 2.5; marker-start: url(#filled-diamond); }
      .association { fill: none; stroke: #51483e; stroke-width: 2.25; marker-end: url(#open-arrow); }
      .dependency { fill: none; stroke: #51483e; stroke-width: 2.25; stroke-dasharray: 8 6; marker-end: url(#open-arrow); }
      .realization { fill: none; stroke: #2f6d43; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#hollow-triangle); }
    </style>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#51483e" stroke-width="1.5" />
    </marker>
    <marker id="hollow-triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#fffaf0" stroke="#2f6d43" stroke-width="1.5" />
    </marker>
    <marker id="filled-diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="11" markerHeight="9" orient="auto">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 Z" fill="#51483e" />
    </marker>
  </defs>

  <text class="section" x="25" y="20">ENTERPRISE BUSINESS RULES - EXACT FIELDS AND BEHAVIOUR</text>

  <!-- Entity relationships. A tournament owns its rounds; a round owns its completed matches. -->
  <path class="composition" d="M 385 153 L 455 153" />
  <text class="label" x="390" y="139">1</text>
  <text class="label" x="425" y="139">0..3</text>
  <path class="composition" d="M 760 153 L 830 153" />
  <text class="label" x="765" y="139">1</text>
  <text class="label" x="800" y="139">1..4</text>
  <path class="association" d="M 1245 153 L 1310 153" />
  <text class="label" x="1274" y="139">2</text>

  <g transform="translate(25 35)">
    <rect class="box entity" width="360" height="250" />
    <text class="stereo" x="180" y="19">&lt;&lt;aggregate root&gt;&gt;</text>
    <text class="name" x="180" y="43">Tournament</text>
    <line class="rule" x1="0" y1="55" x2="360" y2="55" />
    <text class="member" x="12" y="76">+ ENTRANT_COUNT: int = 8 {static}</text>
    <text class="member" x="12" y="96">+ ROUND_COUNT: int = 3 {static}</text>
    <text class="member" x="12" y="116">- id: String</text>
    <text class="member" x="12" y="136">- initialEntrants: List&lt;Pokemon&gt;</text>
    <text class="member" x="12" y="156">- completedRounds: List&lt;TournamentRound&gt;</text>
    <line class="rule" x1="0" y1="168" x2="360" y2="168" />
    <text class="member" x="12" y="190">+ getCurrentEntrants(): List&lt;Pokemon&gt;</text>
    <text class="member" x="12" y="210">+ isComplete(): boolean</text>
    <text class="member" x="12" y="230">+ getChampion(): Pokemon</text>
    <text class="member" x="12" y="248">+ recordRound(round: TournamentRound): void</text>
  </g>

  <g transform="translate(455 35)">
    <rect class="box entity" width="305" height="205" />
    <text class="stereo" x="152.5" y="19">&lt;&lt;entity&gt;&gt;</text>
    <text class="name" x="152.5" y="43">TournamentRound</text>
    <line class="rule" x1="0" y1="55" x2="305" y2="55" />
    <text class="member" x="12" y="80">- roundNumber: int</text>
    <text class="member" x="12" y="102">- matches: List&lt;TournamentMatch&gt;</text>
    <line class="rule" x1="0" y1="117" x2="305" y2="117" />
    <text class="member" x="12" y="143">+ getWinners(): List&lt;Pokemon&gt;</text>
    <text class="member-small" x="12" y="168">{constructor enforces round 1..3}</text>
    <text class="member-small" x="12" y="187">{match count must be 4, 2, then 1}</text>
  </g>

  <g transform="translate(830 35)">
    <rect class="box entity" width="415" height="250" />
    <text class="stereo" x="207.5" y="19">&lt;&lt;entity&gt;&gt;</text>
    <text class="name" x="207.5" y="43">TournamentMatch</text>
    <line class="rule" x1="0" y1="55" x2="415" y2="55" />
    <text class="member" x="12" y="77">- firstPokemon: Pokemon</text>
    <text class="member" x="12" y="97">- secondPokemon: Pokemon</text>
    <text class="member" x="12" y="117">- winner: Pokemon</text>
    <text class="member" x="12" y="137">- firstRemainingHp: double</text>
    <text class="member" x="12" y="157">- secondRemainingHp: double</text>
    <text class="member" x="12" y="177">- turns: List&lt;TurnResult&gt;</text>
    <line class="rule" x1="0" y1="189" x2="415" y2="189" />
    <text class="member-small" x="12" y="212">{winner must be a participant}</text>
    <text class="member-small" x="12" y="232">{remaining HP cannot be negative}</text>
  </g>

  <g transform="translate(1310 35)">
    <rect class="box entity" width="265" height="230" />
    <text class="stereo" x="132.5" y="19">&lt;&lt;entity&gt;&gt;</text>
    <text class="name" x="132.5" y="43">Pokemon</text>
    <line class="rule" x1="0" y1="55" x2="265" y2="55" />
    <text class="member" x="12" y="78">- name: String</text>
    <text class="member" x="12" y="98">- hp: double</text>
    <text class="member" x="12" y="118">- attack: double</text>
    <text class="member" x="12" y="138">- defense: double</text>
    <text class="member" x="12" y="158">- speed: double</text>
    <text class="member" x="12" y="178">- moves: List&lt;Move&gt;</text>
    <text class="member" x="12" y="198">- types: List&lt;String&gt;</text>
    <text class="member-small" x="12" y="218">{official and custom share this type}</text>
  </g>

  <text class="section" x="25" y="328">APPLICATION POLYMORPHISM - DASHED HOLLOW TRIANGLE MEANS IMPLEMENTS</text>

  <!-- Realization arrows are routed from concrete classes to use-case-owned interfaces. -->
  <path class="realization" d="M 250 500 L 250 476 L 175 476 L 175 455" />
  <path class="realization" d="M 680 500 L 680 476 L 535 476 L 535 455" />
  <path class="realization" d="M 1070 500 L 1070 476 L 930 476 L 930 455" />
  <path class="realization" d="M 1430 500 L 1430 476 L 1305 476 L 1305 455" />
  <path class="realization" d="M 1430 500 L 1430 476 L 1515 476 L 1515 455" />

  <!-- A dependency, not inheritance: the interactor creates/records the aggregate. -->
  <path class="dependency" d="M 25 555 L 7 555 L 7 307 L 205 307 L 205 285" />
  <text class="label" x="18" y="303">creates / records</text>

  <g transform="translate(25 350)">
    <rect class="box iface" width="300" height="105" />
    <text class="stereo" x="150" y="22">&lt;&lt;interface&gt;&gt;</text>
    <text class="name-small" x="150" y="45">RunTournamentRoundInputBoundary</text>
    <line class="rule" x1="0" y1="56" x2="300" y2="56" />
    <text class="member-small" x="10" y="77">+ execute(input:</text>
    <text class="member-small" x="24" y="94">RunTournamentRoundInputData): void</text>
  </g>

  <g transform="translate(385 350)">
    <rect class="box iface" width="300" height="105" />
    <text class="stereo" x="150" y="22">&lt;&lt;interface / Strategy&gt;&gt;</text>
    <text class="name" x="150" y="45">TournamentMatchRunner</text>
    <line class="rule" x1="0" y1="56" x2="300" y2="56" />
    <text class="member-small" x="10" y="77">+ run(first: Pokemon, second: Pokemon):</text>
    <text class="member-small" x="24" y="94">TournamentMatch</text>
  </g>

  <g transform="translate(745 350)">
    <rect class="box iface" width="370" height="105" />
    <text class="stereo" x="185" y="22">&lt;&lt;interface&gt;&gt;</text>
    <text class="name-small" x="185" y="45">RunTournamentRoundOutputBoundary</text>
    <line class="rule" x1="0" y1="56" x2="370" y2="56" />
    <text class="member-small" x="10" y="77">+ prepareSuccessView(outputData): void</text>
    <text class="member-small" x="10" y="94">+ prepareFailView(message, failure): void</text>
  </g>

  <g transform="translate(1175 350)">
    <rect class="box iface" width="260" height="105" />
    <text class="stereo" x="130" y="22">&lt;&lt;interface&gt;&gt;</text>
    <text class="name-small" x="130" y="45">TournamentDataAccessInterface</text>
    <line class="rule" x1="0" y1="56" x2="260" y2="56" />
    <text class="member-small" x="10" y="77">+ findById(id): Optional&lt;Tournament&gt;</text>
    <text class="member-small" x="10" y="94">+ save(tournament: Tournament): void</text>
  </g>

  <g transform="translate(1450 350)">
    <rect class="box iface" width="125" height="105" />
    <text class="stereo" x="62.5" y="22">&lt;&lt;interface&gt;&gt;</text>
    <text class="name-small" x="62.5" y="44">TournamentId</text>
    <text class="name-small" x="62.5" y="61">Generator</text>
    <line class="rule" x1="0" y1="68" x2="125" y2="68" />
    <text class="member-small" x="10" y="91">+ newId(): String</text>
  </g>

  <g transform="translate(25 500)">
    <rect class="box usecase" width="450" height="225" />
    <text class="stereo" x="225" y="20">&lt;&lt;use case interactor&gt;&gt;</text>
    <text class="name" x="225" y="44">RunTournamentRoundInteractor</text>
    <line class="rule" x1="0" y1="56" x2="450" y2="56" />
    <text class="member-small" x="12" y="77">- presenter: RunTournamentRoundOutputBoundary</text>
    <text class="member-small" x="12" y="96">- tournamentDataAccess: TournamentDataAccessInterface</text>
    <text class="member-small" x="12" y="115">- pokemonDataAccess: TournamentPokemonDataAccessInterface</text>
    <text class="member-small" x="12" y="134">- idGenerator: TournamentIdGenerator</text>
    <text class="member-small" x="12" y="153">- matchRunner: TournamentMatchRunner</text>
    <text class="member-small" x="12" y="172">- executor: Executor</text>
    <line class="rule" x1="0" y1="182" x2="450" y2="182" />
    <text class="member-small" x="12" y="202">+ execute(input: RunTournamentRoundInputData): void</text>
    <text class="member-small" x="12" y="219">- runMatches(entrants): List&lt;TournamentMatch&gt;</text>
  </g>

  <g transform="translate(505 500)">
    <rect class="box usecase" width="350" height="205" />
    <text class="stereo" x="175" y="20">&lt;&lt;Strategy implementation&gt;&gt;</text>
    <text class="name" x="175" y="44">RandomBattleRunner</text>
    <line class="rule" x1="0" y1="56" x2="350" y2="56" />
    <text class="member" x="12" y="80">- MAX_TURNS: int = 10,000 {static}</text>
    <text class="member" x="12" y="103">- resolveTurn: ResolveTurnInputBoundary</text>
    <text class="member" x="12" y="126">- playerMoveSelector: MoveSelector</text>
    <line class="rule" x1="0" y1="140" x2="350" y2="140" />
    <text class="member-small" x="12" y="164">+ run(first, second): TournamentMatch</text>
    <text class="member-small" x="12" y="188">{creates one fresh Battle per match}</text>
  </g>

  <g transform="translate(890 500)">
    <rect class="box adapter" width="360" height="185" />
    <text class="stereo" x="180" y="20">&lt;&lt;presenter&gt;&gt;</text>
    <text class="name" x="180" y="44">TournamentRoundPresenter</text>
    <line class="rule" x1="0" y1="56" x2="360" y2="56" />
    <text class="member" x="12" y="82">- viewModel: TournamentRoundViewModel</text>
    <line class="rule" x1="0" y1="96" x2="360" y2="96" />
    <text class="member-small" x="12" y="121">+ prepareSuccessView(outputData): void</text>
    <text class="member-small" x="12" y="143">+ prepareFailView(message, failure): void</text>
    <text class="member-small" x="12" y="165">- formatTurn(turn): List&lt;String&gt;</text>
  </g>

  <g transform="translate(1285 500)">
    <rect class="box data" width="290" height="205" />
    <text class="stereo" x="145" y="20">&lt;&lt;data access&gt;&gt;</text>
    <text class="name-small" x="145" y="44">InMemoryTournamentDataAccess</text>
    <line class="rule" x1="0" y1="56" x2="290" y2="56" />
    <text class="member-small" x="12" y="82">- tournaments: Map&lt;String, Tournament&gt;</text>
    <line class="rule" x1="0" y1="96" x2="290" y2="96" />
    <text class="member-small" x="12" y="121">+ findById(id): Optional&lt;Tournament&gt;</text>
    <text class="member-small" x="12" y="143">+ save(tournament: Tournament): void</text>
    <text class="member-small" x="12" y="165">+ newId(): String</text>
    <text class="member-small" x="12" y="188">{ConcurrentHashMap + UUID}</text>
  </g>

  <g transform="translate(25 742)">
    <path class="composition" d="M 0 0 L 36 0" />
    <text class="note" x="46" y="4">composition / lifetime ownership</text>
    <path class="realization" d="M 270 0 L 306 0" />
    <text class="note" x="316" y="4">implements interface</text>
    <path class="dependency" d="M 485 0 L 521 0" />
    <text class="note" x="531" y="4">depends on / creates</text>
    <text class="note" x="725" y="4">- private field</text>
    <text class="note" x="825" y="4">+ public operation</text>
    <text class="note" x="970" y="4">No inheritance arrow: the tournament code extends no base class.</text>
  </g>
</svg>
